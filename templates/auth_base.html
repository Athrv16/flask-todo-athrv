<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e1b4b">
    <title>{% block title %}Auth{% endblock %} — Daily Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='todo.png') }}" type="image/x-icon" />
</head>
<body class="auth-wrapper">

    <!-- Ribbon Background -->
    <div class="auth-ribbon auth-ribbon-1"></div>
    <div class="auth-ribbon auth-ribbon-2"></div>
    <div class="auth-ribbon auth-ribbon-3"></div>
    <div class="auth-ribbon auth-ribbon-4"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>

    <!-- Snackbar Container -->
    <div class="snackbar-container" id="snackbarContainer"></div>

    <!-- Hidden flash data for JS -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <script id="flashData" type="application/json">
            [{% for category, message in messages %}{"category":"{{ category }}","message":"{{ message }}"}{% if not loop.last %},{% endif %}{% endfor %}]
        </script>
    {% endif %}
    {% endwith %}

    <div class="flex-grow-1 d-flex align-items-center justify-content-center p-3 p-md-4">
        <div style="width:100%;max-width:420px;">
            <div class="text-center mb-3 mb-md-4 anim-fade-up">
                <h1 style="font-weight:700;font-size:1.8rem;">
                    <span style="color:#c8d1e0;">
                        <i class="fas fa-check-double" style="color:var(--primary-light);"></i> Daily Flow
                    </span>
                </h1>
                <p style="color:rgba(255,255,255,0.4);font-size:0.85rem;">Organize your day, effortlessly.</p>
            </div>

            <div class="auth-card">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showSnackbar(message, category = 'info', duration = 3000) {
            const container = document.getElementById('snackbarContainer');
            const icons = {
                success: 'fa-check-circle',
                danger: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            const snack = document.createElement('div');
            snack.className = `snackbar snackbar-${category}`;
            snack.innerHTML = `
                <i class="fas ${icons[category] || icons.info}"></i>
                <span class="snackbar-text">${message}</span>
                <button class="snackbar-close" onclick="dismissSnackbar(this.parentElement)">
                    <i class="fas fa-times"></i>
                </button>
                <div class="snackbar-progress" style="animation-duration:${duration}ms;"></div>
            `;
            container.appendChild(snack);
            setTimeout(() => dismissSnackbar(snack), duration);
        }

        function dismissSnackbar(el) {
            if (!el || el.classList.contains('snack-out')) return;
            el.classList.add('snack-out');
            setTimeout(() => el.remove(), 300);
        }

        const flashEl = document.getElementById('flashData');
        if (flashEl) {
            try {
                const flashes = JSON.parse(flashEl.textContent);
                flashes.forEach((f, i) => {
                    setTimeout(() => showSnackbar(f.message, f.category), i * 150);
                });
            } catch(e) {}
        }
    </script>
</body>
</html>
