{% extends 'auth_base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<h2 class="text-center mb-1">Welcome Back</h2>
<p class="text-center text-muted mb-4" style="font-size:0.88rem;">Sign in to your account</p>

<form method="POST">
    <div class="mb-3 anim-fade-up anim-delay-1">
        <label class="form-label fw-semibold">
            <i class="fas fa-user me-1 text-muted"></i>Username
        </label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
    </div>
    <div class="mb-4 anim-fade-up anim-delay-2">
        <label class="form-label fw-semibold">
            <i class="fas fa-lock me-1 text-muted"></i>Password
        </label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
    </div>
    <div class="anim-fade-up anim-delay-3">
        <button type="submit" class="btn btn-app w-100 py-2">
            <i class="fas fa-sign-in-alt me-1"></i>Sign In
        </button>
    </div>
</form>
<p class="text-center mt-4 mb-0 anim-fade-in anim-delay-4" style="font-size:0.88rem;">
    Don't have an account?
    <a href="/register" style="color:var(--primary);font-weight:600;text-decoration:none;">Create one</a>
</p>

{% endblock %}
