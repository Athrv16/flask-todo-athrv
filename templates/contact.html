{% extends 'base.html' %}
{% block body %}
<style>
    body {
        margin-bottom: 100px;
    }
    .contact-banner {
        position: relative;
        width: 100%;
        max-height: 500px;
        overflow: hidden;
    }
    .contact-banner img {
      width: 100%;
      height: auto;
      object-fit: cover;  /* Fills container, may crop */
  }
  
  @media (min-width: 768px) {
      .contact-banner img {
          height: 400px; /* Set a height for larger screens */
      }
  }
  
  
    .form-label-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        background: rgba(0,0,0,0.5);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }
    .contact-form {
        margin: 0 auto;
        max-width: 600px;
    }
</style>

<div class="container-fluid px-0 contact-banner">
    <img src="/static/img/contact.avif" alt="Contact Us" class="img-fluid w-100">
    <div class="form-label-overlay">
        <h2>Contact Us</h2>
        <p>Fill out the form below and we’ll get back to you!</p>
    </div>
</div>

<div class="container mt-5">
    <form class="contact-form" method="post" action="/contact">

        <div class="form-group mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
        </div>

        <div class="form-group mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your phone number">
        </div>

        <div class="form-group mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group mb-3">
            <label for="query" class="form-label">Tell me about your query</label>
            <textarea class="form-control" id="query" name="query" placeholder="Enter your query" rows="3"></textarea>
        </div>

        <div class="button">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
{% endblock body %}
