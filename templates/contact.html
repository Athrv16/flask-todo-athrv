{% extends 'base.html' %}
{% block body  %}
<style>
    body {
      margin-bottom: 100px;
    }
  </style>
  
 <div class ="container-fluid px-0">
    <img src = "/static/img/contact.avif"
         alt="Contact Us"
         width="100%"
         height="600px"
         style="object-fit: cover;">
    </div>
    <div class="container">
        <h1 class="text-center my-4">Contact Us</h1>
        <form style = "margin: 0 auto; max-width: 600px;" method ="post" action="/contact">

            
        <div class="form-group mb-3 ">
            <label for="name" class="form-label">Name</label>
            <input type="name" class="form-control" id="name" name="name" placeholder="Enter your name">
          </div>
          <div class="form-group mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="phone" class="form-control" id="phone" name="phone" placeholder="Enter your Phone Number">
          </div>
        <div class="form-group mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
          </div>
          <div class="form-group mb-3">
            <label for="text" class="form-label">Tell me about your query</label>
            <textarea class="form-control" id="text" name="query" placeholder="Enter your Query" rows="3"></textarea>
          </div>
          <div class= button>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
 </div>
 <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
{% endblock body  %}
